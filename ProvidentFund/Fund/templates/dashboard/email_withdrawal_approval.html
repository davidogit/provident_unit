<!DOCTYPE html>
{% load static %}
<html lang="en">

<!-- Mirrored from themepixels.me/demo/dashbyte/pages/verify-account.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 12 Nov 2023 18:21:29 GMT -->

    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Meta -->
        <meta name="description" content="">
        <meta name="author" content="Themepixels">

        <meta name="csrf-token" content="{{ csrf_token }}">

        <!-- Favicon -->
        <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.png' %}">

        <title>Approve Batch Withdrawal</title>

        <!-- Vendor CSS -->
        <link rel="stylesheet" href="{% static 'lib/remixicon/fonts/remixicon.css' %}">

        <!-- Template CSS -->
        <link rel="stylesheet" href="{% static 'assets/css/style.min.css' %}">
    </head>

    <body class="page-sign">

        <!-- Add a button to approve batch withdrawals center it in the middle of the page and make it responsible -->
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="d-flex justify-content-center">
                        <h3>Batch Withdrawal Approval</h3>
                    </div>
                    <div class="d-flex justify-content-center">
                        <h3>{{ batch }}</h3>
                    </div>
                    
                    <div class="d-flex flex-column justify-content-center m-5">
                        <h5 class="h5 text-center">click here to approve</h5>
                        <button type="button" class="btn btn-outline-secondary btn-lg" id="approve" data-batch-id="{{ batch.id }}">Approve</button>
                    </div>
                </div>
            </div>
        </div>
    

        <script src="{% static 'lib/jquery/jquery.min.js' %}"></script>
        <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
        <script>
            var skinMode = localStorage.getItem('skin-mode');
            if (skinMode) {
            $('html').attr('data-skin', 'dark');
            };

            $(document).ready(function(){
                $('#approve').click(function(){
                    var batch_id = $(this).data('batch-id');
                    $.ajax({
                        url: '',
                        type: 'POST',
                        headers: {
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        data: {
                            'batch_id': batch_id,
                        },
                        success: function(response){
                            console.log(response);
                            if (response.status === 'success'){
                                alert(response.message);
                                //close tab
                                window.close();
                            } else {
                                alert(response.message);
                            }
                        },
                        error: function(error){
                            alert('An error occured');
                            console.log(error);
                        }
                    });
                });
            });
        </script>
    </body>
</html>
