{% extends 'dashboard/base.html' %}


{% block content %}
<div class="main main-app p-3 p-lg-4">
  <div class="row row-cols-auto g-4 g-xxl-5">
      <div class="col-xl">
          <div class="container">
            <h2 class="mb-5">Investment Detail</h2>

            <form method="POST">
              {% csrf_token %}
                <div class="row g-5">
                  <div class="col-md-4">
                    <div class="form-group mb-3">
                      <label for="investmentType" class="form-label">Investment Type</label>
                      <select class="form-control" name="investment_type" id="investmentType">
                        <option value="">--select--</option>
                        {% for acc,label in inv_type %}
                        <option value="{{acc}}">{{ label }}</option>
                        {% endfor %}
                      </select>
                      
                      <div class="row group">
                        <div class="col-md-6"><div class="mt-2" aria-hidden="true">
                          <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                            <input type="radio" class="btn-check" name="type_of_tbill" id="btnradio1" autocomplete="off" value="91 days">
                            <label class="btn btn-outline-primary" for="btnradio1">91 days</label>
                          
                            <input type="radio" class="btn-check" name="type_of_tbill" id="btnradio2" autocomplete="off" value="182 days">
                            <label class="btn btn-outline-primary" for="btnradio2">182 days</label>
                          
                            <input type="radio" class="btn-check" name="type_of_tbill" id="btnradio3" autocomplete="off" value="365 days">
                            <label class="btn btn-outline-primary" for="btnradio3">365 days</label>
                          </div>
                        </div></div>
                        <div class="col-md-6 daycount mt-2">
                          <label for="day_count">Day Count</label>
                          <input type="number" class="form-control" name="day_count" id="day_count">
                        </div>
                      </div>
                      
                    

                    </div>
                    <div class="form-group mb-3">
                      <label for="investmentId" class="form-label">Investment Name</label>
                      <input type="text" class="form-control" id="investmentId" min="1" name="account_name" required>
                    </div>

                    <div class="form-group mb-3">
                      <label for="investmentName" class="form-label">Account Type</label>
                      <select class="form-control" name="account_type" id="investmentName" required>
                      {% for acc,label in account_type %}
                      <option value="{{acc}}">{{ label }}</option>
                      {% endfor %}
                      </select>
                    </div>
                    
                    <div class="form-group mb-3">
                      <label class="form-label" for="years">Time the money is invested for, in years. NB: convert months to years</label>
                      <input type="number" step="0.01" class="form-control" id="years" name="years" required>
                    </div>

                  </div>
          
                  <div class="col-md-4">
                    <div class="form-group mb-3">
                      <label class="form-label" for="principal_amount">Principal Amount</label>
                      <input type="number" class="form-control" id="principal_amount" name="principal_amount" required>
                    </div>

                    <div class="form-group mb-3">
                      <label for="investmentDate" class="form-label">Account Number</label>
                      <input type="number" class="form-control" id="investmentDate" name="account_number" required>
                    </div>

                    <div class="form-group mb-3">
                      <label for="maturityDate" class="form-label">Percentage Interest</label>
                      <input type="number" min="1" step="0.01" class="form-control" id="maturityDate" name="interest_percentage" required>
                    </div>
                  </div>
          
                  <div class="col-md-4">
                    <div class="form-group mb-3">
                      <label for="investmentAmount" class="form-label">Investment Start Date</label>
                      <input type="date" class="form-control" id="investmentAmount" name="interest_start_date" required>
                    </div>
                    <div class="form-group mb-3">
                      <label for="investmentTerm" class="form-label">Investment End Date</label>
                      <input type="date" class="form-control" id="investmentTerm" name="interest_end_date" required>
                    </div>
                    <div class="form-group mb-3">
                      <label for="componding_frequency" class="form-label">Number of times the interest is compounded per year.</label>
                      <input type="number" step="1" min="0" class="form-control" id="componding_frequency" name="componding_frequency" required>
                    </div>

                  </div>
              </div>
              <input type="submit" class="btn btn-outline-primary btn-lg" value="Submit">
            </form>
          </div>
      </div>
    </div>
  </div>

  <!-- main -->
   <script>
    $(document).ready(function(){
      $('.group').hide();
      $('#investmentType').change(function(){
        var investmentType = $(this).val();
        if(investmentType == 'Treasury Bill'){
          $('.group').show();
          
          //change required attribute to true
          $('input[name="type_of_tbill"]').attr('required', true);

        }else{
          $('.group').hide();
          //change required attribute to false
          $('input[name="type_of_tbill"]').attr('required', false);
          //uncheck all radio buttons
          $('input[name="type_of_tbill"]').prop('checked', false);
          //clear day count
          $('input[name="day_count"]').val('');
        }
      });
    });
   </script>
{% endblock %}
