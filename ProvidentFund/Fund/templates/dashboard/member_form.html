{% extends 'dashboard/base.html' %}

{% block content %}

<div class="main main-app p-3 p-lg-4">
    <div class="row row-cols-auto g-4 g-xxl-5">
        <div class="col-xl">
            <div class="container">
              <h2 class="mb-5">Investment Detail</h2>
  
              <form method="POST">
                {% csrf_token %}
                <div class="row g-5">
                    <div class="col-md-4">
                        <div class="form-group mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" min="1" name="first_name">
                        </div>
                    </div>


                    <div class="col-md-4">
                        <div class="form-group mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" name="last_name">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group mb-3">
                            <label for="staffId" class="form-label">Staff ID</label>
                            <input type="text" class="form-control" id="staffId" min="1" name="staff_id">
                        </div>
                    </div>
                    <div>
                        <input type="submit" class="btn btn-primary" value="Submit">
                    </div>
                    
              </form>
            </div>
        </div>
      </div>
    </div>
  
    <!-- main -->
{% endblock %}
