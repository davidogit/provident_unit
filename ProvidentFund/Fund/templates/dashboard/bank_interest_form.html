{% extends 'dashboard/base.html' %}
{% block title %}
<title>Bank Charges Form</title>
{% endblock %}
{% block header %}
<h5>Bank Charges Form</h5>
{% endblock %}

{% block content %}


<div class="main main-app p-3 p-lg-4">
    <div class="row row-cols-auto g-4 g-xxl-5">
        <div class="col-xl">
            <div class="container">
              <form method="POST">
                {% csrf_token %}
                  <div class="row g-5">
                      <div class="col-md-4">
                          <div class="form-floating mb-3">
                            <select class="form-select" name="bank_name" id="bank_name">
                              {% for bank, label in banks %}
                              <option value="{{bank}}">{{ label }}</option>
                              {% endfor %}
                            </select>
                            <label for="bank_name" class="form-label">Bank</label>
                          </div>
                          <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="branch" name="branch" placeholder="">
                            <label for="branch" class="form-label">Branch:</label>
                          </div>
                          <div class="form-floating mb-3">
                            <input type="number" step="1" class="form-control" id="account" name="account_number" placeholder="">
                            <label for="account" class="form-label">Account No:</label>
                          </div>

                          <div class="form-floating mb-3">
                            <input type="date" class="form-control" id="from_date" name="from_date" placeholder="">
                            <label for="from_date" class="form-label">From:</label>
                          </div>


                      </div>
            
                      <div class="col-md-4">
                          <div class="form-floating mb-3">
                            <input type="date" class="form-control" id="to_date" name="to_date">
                            <label for="to_date" class="form-label">To:</label>
                          </div>

                          <div class="form-floating mb-3">
                            <input type="number" step="0.01" class="form-control" id="amount" name="amount" placeholder="">
                            <label for="amount" class="form-label">Amount</label>
                          </div>
  
                          <div class="form-floating mb-3">
                            <textarea class="form-control" name="remarks" id="remarks" cols="20" rows="5" placeholder=""></textarea>
                            <label class="form-label" for="remarks">Remarks</label>
                          </div>
                      </div>
                </div>
                <input type="submit" class="btn btn-primary" value="Submit">
              </form>
            </div>
        </div>
      </div>
    </div>
  
    <!-- main -->

{% endblock %}
