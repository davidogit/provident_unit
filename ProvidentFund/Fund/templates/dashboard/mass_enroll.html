{% extends 'dashboard/base.html' %}
{% block content %}
{% block head %}
<meta name="csrf-token" content="{{ csrf_token }}">

<style>
    /* Center the spinner */
    .spinner-wrapper {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
  
    .spinner {
      width: 50px;
      height: 50px;
      border: 6px solid #ddd;
      border-top-color: #4285F4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
  
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
</style>
{% endblock %}
{% block title %}
<title>Mass Enroll</title>
{% endblock %}
{% block header %}
<h5>Mass Enrollment</h5>
{% endblock %}

<div class="main main-app p-3 p-lg-4">
    <div class="d-md-flex align-items-center justify-content-between mb-4">
        <form method="post" action="" enctype="multipart/form-data" id="file-form">
            {% csrf_token %}
            <div class="form-group" style="display: in-line;">
                <label for="document" class="form-label">Upload File(.xls)</label>
                <input class="form-control" type="file" name="excel_sheet" id="file-input" accept=".xlsx, .xls">
                <button class="btn btn-outline-secondary" type="button" id="upload-btn" disabled>Upload File</button>
            </div>
        </form>
    </div>
    <div class="overflow-auto p-1" id="preview-area" style="margin-top: 20px; display: none; max-height:500px">
        <h4>Preview File</h4>
        <div id="table-container"></div>
    </div>
</div>
<!-- Spinner -->
<div class="spinner-wrapper" id="spinner-wrapper">
    <div class="spinner"></div>
</div> 



<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  // Handle file input change event
  document.getElementById("file-input").addEventListener("change", handleFile, false);
  // Handle upload button click event
  document.getElementById("upload-btn").addEventListener("click", submitFile, false);
  
  // To store the file data
  let fileData = null; 

  // Get CSRF token from the meta tag
  var csrfToken = $('meta[name="csrf-token"]').attr('content');

  function handleFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: "array" });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      fileData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

      // Display the preview
      displayPreview(fileData);
    };
    reader.readAsArrayBuffer(file);
  }

  function displayPreview(data) {
    if (!data || data.length === 0) return;

    const container = document.getElementById("table-container");
    container.innerHTML = ""; // Clear any previous content

    const table = document.createElement("table");
    table.className = "table table-bordered";
    const tbody = document.createElement("tbody");

    data.forEach((row, rowIndex) => {
      const tr = document.createElement("tr");
      row.forEach((cell) => {
        const td = document.createElement(rowIndex === 0 ? "th" : "td");
        td.textContent = cell !== undefined ? cell : "";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.appendChild(table);

    // Show preview area and enable upload button
    document.getElementById("preview-area").style.display = "block";
    document.getElementById("upload-btn").disabled = false;
  }

  function submitFile() {
    const fileInput = document.getElementById("file-input");// Get the file input element
    const file = fileInput.files[0]; // Get the file object

    if (!file){
        alert('Please select a file to upload');
        return;
    }
    
    // Show spinner
    document.getElementById("spinner-wrapper").style.display = "flex";

    //pass the file to the form data
    const formData = new FormData();
    formData.append('excel_sheet', file);
    //append csrf_token to the form data
    formData.append('csrfmiddlewaretoken', csrfToken);


    // Send the fileData to the server via AJAX
    $.ajax({
        type: "POST",
        url: "",
        data: formData,
        processData: false,
        contentType: false,
        success: function (response) {
            if (response.status === 'success'){
                document.getElementById("spinner-wrapper").style.display = "none";
                alert(response.message);
                console.log(response);
            }else{
                document.getElementById("spinner-wrapper").style.display = "none";
                setTimeout(() => {
                    alert(response.message);
                }, 100);
                console.log(response);
            }

        },
        error: function (error) {
            document.getElementById("spinner-wrapper").style.display = "none";
            // delay the alert to allow the spinner to hide
            setTimeout(() => {
                alert("An error occurred while uploading the file.");
            }, 100);
            console.error("Error uploading file:", error);
            alert("An error occurred while uploading the file.");
        }
    });

  }
</script>

{% endblock %}
