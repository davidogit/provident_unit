{% extends 'dashboard/base.html' %}
{% block title %}
<title>Delete Investment</title>
{% endblock %}
{% block header %}
<h5 class="fw-bold"><i class="bi bi-trash me-2"></i>Delete Investment</h5>
{% endblock %}
{% block content %}
    
<div class="main main-app p-3 p-lg-4">
    <div class="row g-3 justify-content-center">
       
        <div class="col-md-12 col-xl-10">
          <div class="card card-one">
            <div class="card-body">
                <div class="row g-2">
                    <div class="row card-value text-center">
                        <h2 class="mb-5 mt-5 text-decoration-underline">
                            Confirm Delete of {{ investment.account_name }}
                        </h2>
                    </div>
                    <div class="d-flex justify-content-between">
                        <form action="" method="POST" class="delete_investment">
                            {% csrf_token %}
                            <input class="btn btn-danger" type="submit" value="Delete">
                            
                        </form>
                        <div>
                            <a class="btn btn-primary" href="{% url 'investment_list' scheme_name=request.scheme_name tenant_id=request.tenant.id %}">Cancel</a>
                        </div>
                    </div>
                   
                </div>
            </div><!-- card-body -->
          </div><!-- card-one -->
    </div>
</div>
<script>
    $(document).ready(function(){
        $('.delete_investment').on('submit', function(e){
            e.preventDefault();
            
            if (!confirm('Are you sure you want to delete this investment?')) {
                return;
            }
    
            $.ajax({
                url: '',
                type: 'DELETE',
                data: $(this).serialize(),
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                success: function(response) {
                    if (response.status === 'success') {
                        console.log(response)
                        alert(response.message);
                        window.location.href = response.redirect_url;
                    } else {
                        console.log(response)
                        alert(response.message);
                    }
                },
                error: function(jqXHR) {
                    var message = jqXHR.responseJSON ? jqXHR.responseJSON.message : 'An unexpected error occurred.';
                    alert(message);
                    console.error(message);
                }
            });
        });
    });
</script>
{% endblock %}
