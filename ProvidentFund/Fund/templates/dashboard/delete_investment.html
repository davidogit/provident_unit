{% extends 'dashboard/base.html' %}

{% block content %}
    
<div class="main main-app p-3 p-lg-4">
    <div class="row g-3 justify-content-center">
       
        <div class="col-md-12 col-xl-10">
          <div class="card card-one">
            <div class="card-body">
                <div class="row g-2">
                    <div class="row card-value text-center">
                        <h2 class="mb-5 mt-5 text-decoration-underline">
                            Confirm Delete of {{ investment.account_name }}
                        </h2>
                    </div>
                    <div class="d-flex justify-content-between">
                        <form action="" method="POST">
                            {% csrf_token %}
                            <input class="btn btn-danger" type="submit" value="Delete">
                            
                        </form>
                        <div>
                            <a class="btn btn-primary" href="{% url 'investment_list' scheme_name=request.scheme_name tenant_id=request.tenant.id %}">Cancel</a>
                        </div>
                    </div>
                   
                </div>
            </div><!-- card-body -->
          </div><!-- card-one -->
    </div>



</div>
{% endblock %}
