{% extends 'dashboard/base.html' %}

{% block title %}
<title>Payout Invoice</title>
{% endblock %}

{% block header %}
<h5>Payout Invoice</h5>
{% endblock %}

{% block content %}
<div class="main main-app p-3 p-lg-4">
    <div class="row row-cols-auto g-4 g-xxl-5 order-div">
        <div class="col-12 d-flex flex-row justify-content-center">
            <!-- add a pill shape search bar spanning 2 columns -->
            <div class="row row-cols-auto g-2 g-lg-3 mb-4">
                <div class="col-auto">
                    <div class="input-group input-group-pill">
                        <input type="text" class="form-control" placeholder="Search for purchase orders...">
                        <button class="btn btn-icon btn-pill btn-secondary search_order">
                            <i class="ri-search-line"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- add a div to stretch across the width which will display search results of an item -->
        <div class="col-12">
            <div class="card card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-nowrap table-align-middle table-vcenter">
                        <thead>
                            <tr>
                                <th>Invoice Number</th>
                                <th>Supplier</th>
                                <th>Total Order Amount</th>
                                <th>Due Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody class="table-striped order_table">
                            <!-- Data added dynamically from ajax -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add modal to allow user to enter amount to pay -->
        <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalLabel" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Invoice Payment</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form action="" method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="amount" class="form-label">Enter amount to pay</label>
                                <input type="number" class="form-control" id="amount" name="supplier_invoice_amount" required>
                            </div>
                            <button type="submit" class="btn btn-primary pay-invoice">Pay</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function(){
        $('.search_order').on('click', function(e){
            e.preventDefault();
            var order_number = $(this).closest('.input-group').find('input').val();
            var tenant_id = "{{ request.tenant.id }}"
            const tableBody = $(this).closest('.order-div').find('.order_table')
            var url = `/${tenant_id}/fund/fetch-purchase-order/${order_number}/`
            console.log(url)
            $.ajax({
                url:url,
                type:'GET',
                success:function(response){
                    console.log(response)
                    if (response.status === 'success'){
                        tableBody.html('') //Empty table

                        const row = `
                            <tr>
                                <td>${response.order_number}</td>
                                <td>${response.supplier}</td>
                                <td>${response.total_order_amount}</td>
                                <td>${response.amount_to_pay}</td>
                                <td>
                                    <button class="btn btn-sm btn-primary">View</button>
                                    <button class="btn btn-sm btn-success pay" data-order-id="${response.order_number}" data-bs-toggle="modal" data-bs-target="#payInvoiceModal">Pay</button>
                                </td>
                            </tr>
                        `
                        tableBody.append(row)
                        
                        //display modal when pay is clicked
                        $('.pay').on('click', function(){
                            const orderId = $(this).data('order-id')
                            $('#itemModal').find('form').attr('action', `/${tenant_id}/fund/payout-invoice/`)
                            $('#itemModal').find('form').append(`<input type="hidden" name="order_number" value="${orderId}">`)

                            //display modal
                            $('#itemModal').modal('show')

                        })
                        
                    }else{
                        console.log(response)
                        alert(response.message);
                    }
                    
                },
                error:function(jqXHR){
                    message = jqXHR.responseJSON.message || 'An error occured';
                    console.log(message)
                    alert('An error occured');
                }
            });
        });

        $('.pay-invoice').on('click', function(e){
            e.preventDefault();
            var form= $(this).closest('form');
            console.log(form.serialize())

            $.ajax({
                url:form.attr('action'),
                type: 'POST',
                data: form.serialize(),
                headers:{
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                success:function(response){
                    if (response.status === 'success'){
                        alert(response.message);
                        window.location.reload();

                    }else{
                        alert(response.message);
                    }
                },
                error:function(jqXHR){
                    message = jqXHR.responseJSON.message || 'An error occured';
                    console.log(message)
                    alert(message)
                }
            });
        });
    });
</script>
{% endblock %}
