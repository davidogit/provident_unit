<form method="POST" id="paymentForm">
    {% csrf_token %}
    
    <!-- Scheme Selection -->
    <div class="form-group mb-4">
      <label for="scheme-type" class="form-label fw-medium">Select Scheme</label>
      <div class="input-group">
        <span class="input-group-text  border-end-0">
          <i class="ri-bank-line text-primary"></i>
        </span>
        <select
          name="scheme_id"
          id="scheme-type"
          class="form-select border-start-0 ps-0"
          required
          aria-label="Select Scheme"
        >
          <option value="" disabled selected>Choose scheme type</option>
          {% for scheme in schemes %}
          <option value="{{ scheme.id }}">{{ scheme.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-text mt-1" id="scheme-description">
        Select a scheme to make a contribution
      </div>
    </div>
    
    <!-- Email Address -->
    <div class="form-group mb-4">
      <label for="email-address" class="form-label fw-medium">Email Address</label>
      <div class="input-group">
        <span class="input-group-text  border-end-0">
          <i class="ri-mail-line text-primary"></i>
        </span>
        <input
          name="email"
          type="email"
          id="email-address"
          class="form-control border-start-0 ps-0"
          placeholder="Your email address"
          required
          aria-label="Email Address"
        />
      </div>
      <div class="form-text mt-1">
        Payment receipt will be sent to this email
      </div>
    </div>
    
    <!-- Amount Input -->
    <div class="form-group mb-4">
      <label for="amount" class="form-label fw-medium">Amount (GHS)</label>
      <div class="input-group">
        <span class="input-group-text  border-end-0">
          <i class="ri-money-cedi-circle-line text-primary"></i>
        </span>
        <input
          name="amount"
          type="number"
          id="amount"
          class="form-control border-start-0 ps-0"
          placeholder="Enter amount in GHS"
          min="1"
          step="0.01"
          required
          aria-label="Amount in GHS"
        />
      </div>
    </div>
    
    <input
      type="hidden"
      id="reference"
      name="reference"
      value="{{ reference }}"
    />
    
    <!-- Payment Security Note -->
    <div class="alert alert-light border-0 bg-light-subtle rounded-3 mb-4">
      <div class="d-flex">
        <i class="ri-shield-check-line text-success fs-5 me-2 mt-1"></i>
        <div>
          <h6 class="fw-medium mb-1">Secure Payment</h6>
          <p class="mb-0 small">Your payment information is encrypted and securely processed by Paystack.</p>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="form-submit">
      <button
        type="button"
        onclick="payWithPaystack()"
        id="payButton"
        class="btn btn-primary btn-lg w-100 py-3"
      >
        <i class="ri-bank-card-line me-2"></i>
        <span id="buttonText">Make Payment</span>
        <span id="loadingSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
      </button>
    </div>
</form>

 <script src="https://js.paystack.co/v2/inline.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const paymentForm = document.getElementById("paymentForm");
    const paystackPublicKey = "{{ PAYSTACK_PUBLIC_KEY }}";
    const reference = "{{ reference }}";
    const schemeSelect = document.getElementById("scheme-type");
    const schemeDescription = document.getElementById("scheme-description");
    const payButton = document.getElementById("payButton");
    const buttonText = document.getElementById("buttonText");
    const loadingSpinner = document.getElementById("loadingSpinner");

    // Update scheme description when scheme is selected
    schemeSelect.addEventListener("change", function() {
      const selectedOption = this.options[this.selectedIndex];
      if (selectedOption.value) {
        schemeDescription.textContent = `Contributing to: ${selectedOption.text}`;
      } else {
        schemeDescription.textContent = "Select a scheme to make a contribution";
      }
    });

    paymentForm.addEventListener("submit", function (e) {
      e.preventDefault();
    });

    window.payWithPaystack = function () {
      console.log("Pay with Paystack called");
      const schemeId = document.getElementById("scheme-type").value;
      const email = document.getElementById("email-address").value;
      const amount = document.getElementById("amount").value;

      if (!schemeId || !email || !amount) {
        showToast("Please fill in all fields", "warning");
        return;
      }
      
      if (parseFloat(amount) < 1) {
        showToast("Minimum payment amount is GHS 1.00", "warning");
        return;
      }

      console.log("Fields are filled, proceeding to payment");
      
      // Show loading state
      payButton.disabled = true;
      buttonText.textContent = "Processing...";
      loadingSpinner.classList.remove("d-none");

      let handler = new PaystackPop();
      handler.newTransaction({
        key: paystackPublicKey,
        email: email,
        amount: Math.round(parseFloat(amount) * 100), // Ensure amount is an integer
        currency: "GHS",
        ref: reference,
        onClose: function () {
          console.log("Payment window closed");
          showToast("Transaction was not completed, window closed.", "warning");
          
          // Reset button state
          payButton.disabled = false;
          buttonText.textContent = "Make Payment";
          loadingSpinner.classList.add("d-none");
        },
        callback: function (response) {
          console.log("Payment response:", response);
          recordTransaction(response, schemeId, email, amount);
        },
      });
    };

    function recordTransaction(response, schemeId, email, amount) {
      console.log("Recording transaction with data:", {
        response,
        schemeId,
        email,
        amount,
      });
      
      // Show recording state
      buttonText.textContent = "Recording Payment...";
      
      fetch("", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({
          scheme_id: schemeId,
          email: email,
          amount: amount,
          reference: response.reference,
        }),
      })
        .then((response) => {
          console.log("Server response status:", response.status);
          if (!response.ok) {
            throw new Error("Network response was not ok: " + response.status);
          }
          return response.json();
        })
        .then((data) => {
          console.log("Server response data:", data);
          if (data.status === "success") {
            showToast("Payment successful!", "success");
            
            // Show success state
            buttonText.textContent = "Payment Successful!";
            payButton.classList.remove("btn-primary");
            payButton.classList.add("btn-success");
            
            // Redirect after a short delay
            setTimeout(() => {
              if (data.redirect_url){
                window.location.href = data.redirect_url;
              } else {
                console.error("Redirect URL not provided");
                // Reset form if no redirect
                paymentForm.reset();
                payButton.disabled = false;
                buttonText.textContent = "Make Payment";
                loadingSpinner.classList.add("d-none");
                payButton.classList.remove("btn-success");
                payButton.classList.add("btn-primary");
              }
            }, 1500);
          } else {
            showToast("Payment recording failed: " + data.message, "danger");
            
            // Reset button state
            payButton.disabled = false;
            buttonText.textContent = "Make Payment";
            loadingSpinner.classList.add("d-none");
          }
        })
        .catch((error) => {
          console.error("Error details:", error);
          showToast("An error occurred while recording the transaction.", "danger");
          
          // Reset button state
          payButton.disabled = false;
          buttonText.textContent = "Make Payment";
          loadingSpinner.classList.add("d-none");
        });
    }
    
    // Toast notification function
    window.showToast = function(message, type) {
      // Check if toast container exists, if not create it
      let toastContainer = document.querySelector('.toast-container');
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.className = 'toast-container position-fixed bottom-0 end-0 p-3';
        document.body.appendChild(toastContainer);
      }
      
      // Create toast element
      const toastEl = document.createElement('div');
      toastEl.className = `toast align-items-center text-white bg-${type} border-0`;
      toastEl.setAttribute('role', 'alert');
      toastEl.setAttribute('aria-live', 'assertive');
      toastEl.setAttribute('aria-atomic', 'true');
      
      // Toast content
      toastEl.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">
            ${message}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      `;
      
      // Add toast to container
      toastContainer.appendChild(toastEl);
      
      // Initialize and show toast
      const toast = new bootstrap.Toast(toastEl, { delay: 5000 });
      toast.show();
      
      // Remove toast after it's hidden
      toastEl.addEventListener('hidden.bs.toast', function() {
        toastEl.remove();
      });
    }
  });
</script>
