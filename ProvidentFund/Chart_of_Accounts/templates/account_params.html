{% extends 'dashboard/base.html' %}
{% block title %}
<title>
    Account Parameters
</title>
{% endblock %}

{% block header %}
<h5 class="fw-bold"><i class="bi bi-rulers me-2"></i>Account Parameters</h5>
{% endblock %}

{% block content %}
<div class="main main-app p-3 p-lg-4">
    <div class="row row-cols-auto g-4 g-xxl-5">
        <div class="col-xl">
            <form id="parameter_form" action="" method="POST">
                {% csrf_token %}
                <div class="row row-cols-auto g-3">
                    <div class="col-12">
                        <label for="account_code_length" class="form-label">Account Code Length</label>
                        <input type="number" class="form-control" id="account_code_length" min="0" name="account_code_length" value="{{ account_code_len }}">
                    </div>
                    <!-- submit button -->
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </div>    
            </form>
        </div>
    </div>
</div>
<script>
    $(documnet).ready(function(){
        $('#parameter_form').on('submit', function(e){
            e.preventDefault();
            var form = $(this);
            var account_code_length = form.find('#account_code_length').val();
            $.ajax({
                type: 'POST',
                url: '',
                data: {
                    account_code_length: account_code_length
                },
                headers: {'X-CSRFToken': '{{ csrf_token }}'},
                success: function(response){
                    console.log(response);
                    if (response.status === 'success'){
                        alert(response.message);
                    }else{
                        alert(response.message);
                    }  
                },
                error:function(jqXHR){
                    message = jqXHR.responseJSON.message;
                    console.log(message);
                    alert(message);
                }
            });
        });
    });
</script>
{% endblock %}
