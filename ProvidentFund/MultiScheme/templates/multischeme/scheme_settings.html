{% extends 'dashboard/base.html' %}

{% block title %}
<title>Scheme Settings</title>
{% endblock %}
{% block header %}
<h5>Scheme Settings</h5>
{% endblock %}

{% block content %}
<div class="main main-app p-3 p-lg-4">
  <div class="row row-cols-auto g-4 g-xxl-5">
    <!-- Scheme Settings -->
    <div class="col-xl">
      <div class="container border-bottom border-secondary border-5 rounded p-5">
        <!-- <h2 class="mb-5 text-center">Scheme Settings</h2> -->

        <form method="POST" id="scheme-settings">
          {% csrf_token %}
            <div class="row g-5 justify-content-center">
              <div class="col-md-4">

                <div class="form-floating mb-3">
                  <input class="form-control" type="number" step="1" min="1" max="31" name="contribution_day" id="contribution_day"  value="{{ settings.contribution_day }}" placeholder="" required>
                  <label for="contribution_day" class="form-label">Contribution Day of Month</label>
                </div>

                <div class="form-floating mb-3">
                  <input type="number" step="1" min="0" max="31" class="form-control"id="grace_period_contribution"name="grace_period_contribution" value="{{ settings.grace_period_contribution }}" placeholder="" required>
                  <label for="grace_period_contribution" class="form-label">Grace Period for Contribution Deadline (days) eg. 10</label>
                </div>
                <div class="form-floating mb-3">
                  <input type="number" step="1" min="0" class="form-control"id="period_of_delayed_calculation"name="period_of_delayed_calculation" value="{{ settings.period_of_delayed_calculation }}" placeholder="" required>
                  <label for="period_of_delayed_calculation" class="form-label">Period of delayed interest calculation (days)</label>
                </div>
                <div class="form-floating mb-3">
                  <input type="number" step="0.001" min="0" class="form-control"id="delayed_interest_rate"name="delayed_interest_rate" value="{{ settings.delayed_interest_rate }}" placeholder="" required>
                  <label for="delayed_interest_rate" class="form-label">Current Rate: %</label>
                </div>
              </div>

              <!-- <div class="col-md-4">
                
              </div>
      
              <div class="col-md-4">
                
              </div>
      
              <div class="col-md-4">

              </div> -->
              
          </div>
          <button type="submit" class="btn btn-outline-primary btn-lg">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>
  <!-- main -->
<script>
  // Scheme settings
  $(document).ready(function(){
    $('#scheme-settings').on('submit', function(event){
      event.preventDefault();
      var form = $(this);
      $.ajax({
        url: form.attr('action'),
        type: form.attr('method'),
        data: form.serialize(),
        success: function(response){
          if (response.status === 'success'){
            alert(response.message);
            window.location.href = response.redirect_url;
          }else{
            alert(response.message);
          }
        },
        error: function(response){
          alert('An error occurred');
        }
      });
    });
  });
</script>
{% endblock %}
