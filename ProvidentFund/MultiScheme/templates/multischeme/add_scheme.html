{% extends 'dashboard/base.html' %}

{% block title %}
<title>configure scheme</title>
{% endblock %}

{% block content %}
<div class="main main-app p-3 p-lg-4">
  <div class="row row-cols-auto g-4 g-xxl-5">
    <div class="col-xl">
      <div class="container border-bottom border-secondary border-5 rounded p-5">
        <h2 class="mb-5 text-center">Scheme Configuration</h2>

        <form method="POST">
          {% csrf_token %}
            <div class="row g-5 justify-content-center">
              <div class="col-md-4">

                <div class="form-group mb-3">
                  <label for="scheme_name" class="form-label">Scheme Name</label>
                  <input class="form-control" type="text" name="name" id="scheme_name">
                </div>

                <div class="form-group mb-3">
                  <label for="eligbility" class="form-label">Eligibility Criteria: Number of Months</label>
                  <input type="number" class="form-control" id="eligbility" name="eligibility_criteria_months" required>
                </div>
                <div class="form-group mb-3">
                  <label for="desc" class="form-label">Description</label>
                    <textarea class="form-control" id="desc" name="description" cols="9" rows="2" required></textarea>
                </div>
              </div>

              <div class="col-md-4">
                <div class="form-group mb-3">
                  <div class="form-group mb-3">
                    <label class="form-label" for="dist_perc">Distribution Percentage (Percentage of fund's earnings to be allocated to members) in percentage (%)</label>
                    <input type="number" step="0.01" min="1" class="form-control" id="dist_perc" name="distribution_percentage" required>
                  </div>


                  <div class="form-group mb-3">
                    <label class="form-label" for="admin_cost">Administrative cost (account maintenance fees,charges on withdrawals, legal and compliance cost, other miscellaneous) in percentage (%)</label>
                    <input type="number" step="0.01" min="1" class="form-control" id="admin_cost" name="administrative_costs_percentage" required>
                  </div>
                </div>
              </div>
      
              <!-- <div class="col-md-4">
                
              </div>
      
              <div class="col-md-4">

              </div> -->
              <input type="submit" class="btn btn-primary" value="Submit">
          </div>
        </form>
      </div>
    </div>

    <!-- Scheme Settings -->
    <div class="col-xl">
      <div class="container border-bottom border-secondary border-5 rounded p-5">
        <h2 class="mb-5 text-center">Scheme Settings</h2>

        <form method="POST">
          {% csrf_token %}
            <div class="row g-5 justify-content-center">
              <div class="col-md-4">

                <div class="form-group mb-3">
                  <label for="contribution_day" class="form-label">Contribution Day</label>
                  <input class="form-control" type="number" step="1" min="1" max="31" name="contribution_day" id="contribution_day" required>
                </div>

                <div class="form-group mb-3">
                  <label for="grace_period_contribution" class="form-label">Grace Period for Contribution Deadline (Number of days) eg. 10</label>
                  <input type="number" step="1" min="0" max="31" class="form-control"id="grace_period_contribution"name="grace_period_contribution" required>
                </div>
                <div class="form-group mb-3">
                  <label for="delayed_interest_rate" class="form-label">Current Rate: %</label>
                  <input type="number" step="0.001" min="0" class="form-control"id="delayed_interest_rate"name="delayed_interest_rate" required>
                </div>
              </div>

              <!-- <div class="col-md-4">
                
              </div>
      
              <div class="col-md-4">
                
              </div>
      
              <div class="col-md-4">

              </div> -->
              <input type="submit" class="btn btn-primary" value="Submit">
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

  <!-- main -->
{% endblock %}
