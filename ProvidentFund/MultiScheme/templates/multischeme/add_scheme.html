{% extends 'dashboard/base.html' %}

{% block title %}
<title>configure scheme</title>
{% endblock %}
{% block header %}
<h5>Configure Scheme</h5>
{% endblock %}

{% block content %}
<div class="main main-app p-3 p-lg-4">
  <div class="row row-cols-auto g-4 g-xxl-5">
    <div class="col-xl">
      <div class="container border-bottom border-secondary border-5 rounded p-5">
        <!-- <h2 class="mb-5 text-center">Scheme Configuration</h2> -->

        <form method="POST" id="scheme-form">
          {% csrf_token %}
            <div class="row g-5 justify-content-center">
              <div class="col-md-4">

                <div class="form-floating mb-3">
                  <input class="form-control" type="text" name="name" id="scheme_name" placeholder="">
                  <label for="scheme_name" class="form-label">Scheme Name</label>
                </div>

                <div class="form-floating mb-3">
                  <input type="number" class="form-control" id="eligbility" name="eligibility_criteria_months" placeholder="" required>
                  <label for="eligbility" class="form-label">Eligibility Criteria: Number of Months</label>
                </div>
                <div class="form-floating mb-3">
                    <textarea class="form-control" id="desc" name="description" cols="9" rows="2" required placeholder=""></textarea>
                    <label for="desc" class="form-label">Description</label>
                </div>
              </div>

              <div class="col-md-4">
                <div class="mb-3">
                  <div class="form-floating mb-3">
                    <input type="number" step="0.01" min="1" class="form-control" id="dist_perc" name="distribution_percentage" placeholder="" required>
                    <label class="form-label" for="dist_perc">Member Percentage Allocation</label>
                  </div>


                  <div class="form-floating mb-3">
                    <input type="number" step="0.01" min="1" class="form-control" id="admin_cost" name="administrative_costs_percentage" placeholder="" required>
                    <label class="form-label" for="admin_cost">Administrative cost Percentage Allocation</label>
                  </div>
                </div>
              </div>
      
              <!-- <div class="col-md-4">
                
              </div>
      
              <div class="col-md-4">

              </div> -->
          </div>
          <button type="submit" class="btn btn-outline-primary btn-lg" value="">Save</button>
        </form>
      </div>
    </div>

    <!-- Scheme Settings -->
 
  </div>
</div>
  <!-- main -->
<script>
  //Scheme creation
  $(document).ready(function(){
    $('#scheme-form').on('submit', function(event){
      event.preventDefault();
      var form = $(this);
      $.ajax({
        url: form.attr('action'),
        type: form.attr('method'),
        data: form.serialize(),
        success: function(response){
          if (response.status === 'success'){
            alert(response.message);
            window.location.href = response.redirect_url;
          }else{
            alert(response.message);
          }
        },
        error: function(response){
          alert('An error occurred');
        }
      });
    });
  });
</script>
{% endblock %}
