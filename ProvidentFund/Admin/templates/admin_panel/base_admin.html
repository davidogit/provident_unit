{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Admin - Provident Fund</title>

  
    <link rel="stylesheet" href="{% static 'lib/remixicon/fonts/remixicon.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.min.css' %}">
    <style>
        .sidebar {
            width: 250px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            background-color: #f8f9fa;
            transition: all 0.3s;
        }

        .sidebar-header {
            padding: 10px;
            background-color: #ffffff;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-content {
            margin-left: 250px;
            transition: all 0.3s;
        }

        .collapsed .sidebar {
            margin-left: -250px;
        }

        .collapsed .main-content {
            margin-left: 0;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            color: black;
        }

        .collapsed .menu-icon {
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-logo">Provident Fund</a>
            <span class="menu-icon" id="toggleSidebar"><i class="ri-menu-line"></i></span>
        </div>
        <div id="sidebarMenu" class="sidebar-body">
            <div class="nav-group show">
                <a href="#" class="nav-label">Access Management</a>
                <ul class="nav nav-sidebar">
                    <li class="nav-item">
                        <a href="{% url 'assign_roles' tenant_id=request.tenant.id %}" class="nav-link has-sub">
                            <i class="ri-user-star-line fs-32 lh-1 me-3"></i>
                            <span>Assign Roles</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'add_user' tenant_id=request.tenant.id %}" class="nav-link has-sub">
                            <i class="ri-user-add-line fs-32 lh-1 me-3"></i>
                            <span>Add User</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'manage_users' tenant_id=request.tenant.id %}" class="nav-link has-sub">
                            <i class="ri-user-settings-line fs-32 lh-1 me-3"></i>
                            <span>Manage Users</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #ccc;">
            <div class="navbar-brand">
                <h2>Administrator Dashboard</h2>
            </div>
            <div class="navbar-links" style="display: flex; align-items: center;">
                <span>Welcome, (user's name)</span>
                <a href="{% url 'logout' tenant_id=request.tenant.id %}" class="nav-link" style="margin-left: 20px;">Logout</a>
                {% comment %} <a href="{% url 'profile' tenant_id=request.tenant.id %}" class="nav-link" style="margin-left: 20px;"> {% endcomment %}
                    <i class="ri-user-line"></i> Profile
                </a>
                <a href="#" class="dropdown-link" data-bs-toggle="dropdown" data-bs-auto-close="outside" style="margin-left: 20px;">
                    <i class="ri-settings-3-line" style="font-size: 24px;"></i>
                </a>
                
                <div class="dropdown-menu dropdown-menu-end mt-10-f">
                    <label>Skin Mode</label>
                    <nav id="skinMode" class="nav nav-skin">
                        <a href="#" class="nav-link active">Light</a>
                        <a href="#" class="nav-link">Dark</a>
                    </nav>
                    <hr>
                    <label>Sidebar Skin</label>
                    <nav id="sidebarSkin" class="nav nav-skin">
                        <a href="#" class="nav-link active">Default</a>
                        <a href="#" class="nav-link">Prime</a>
                        <a href="#" class="nav-link">Dark</a>
                    </nav>
                    <hr>
                    <label>Direction</label>
                    <nav id="layoutDirection" class="nav nav-skin">
                        <a href="#" class="nav-link active">LTR</a>
                        <a href="#" class="nav-link">RTL</a>
                    </nav>
                </div>
            </div>
        </div>

        <main class="content">
            {% block content %}
            {% endblock %}
        </main>

        <footer class="footer">
         
        </footer>
    </div>


    <script src="{% static 'lib/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'assets/js/script.min.js' %}"></script>
    <script>
        document.getElementById('toggleSidebar').addEventListener('click', function () {
            document.body.classList.toggle('collapsed');
            if (document.body.classList.contains('collapsed')) {
                this.style.position = 'fixed';
                this.style.left = '20px';
                this.style.top = '20px';
                this.style.zIndex = '1000';
            } else {
                this.style.position = '';
                this.style.left = '';
                this.style.top = '';
                this.style.zIndex = '';
            }
        });
    </script>
</body>
</html>
