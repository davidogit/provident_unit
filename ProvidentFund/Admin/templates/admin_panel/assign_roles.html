{% extends 'admin_panel/base_admin.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4 text-2xl font-bold text-center">Add Roles</h2>

    <!-- Search and Filter -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <input type="text" class="form-control me-2" id="searchUser" placeholder="Search user...">
    </div>

    <!-- Role Management Table -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Permissions</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Example row, replace with dynamic data -->
            <tr>
                <td>JohnDoe</td>
                <td>john.doe@example.com</td>
                <td><span class="badge bg-primary">Admin</span></td>
                <td>
                    <button class="btn btn-sm btn-info" data-bs-toggle="modal" data-bs-target="#editModal">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteUser(this)">Delete</button>
                </td>
            </tr>
            <!-- More rows as needed -->
        </tbody>
    </table>

    <!-- Activity Log -->
    <div class="mt-4">
        <h3>Recent Activities</h3>
        <ul class="list-group">
            <li class="list-group-item">Admin assigned 'JohnDoe' as 'Admin' on 2024-07-17</li>
            <!-- More activities -->
        </ul>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Edit User Permissions</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <div class="mb-3">
                        <label for="editUser" class="form-label">User</label>
                        <input type="text" class="form-control" id="editUser" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="editPermissions" class="form-label">Permissions</label>
                        <select multiple class="form-select" id="editPermissions">
                            <option>Permission 1</option>
                            <option>Permission 2</option>
                            <option>Permission 3</option>
                            <!-- Add more permissions as needed -->
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function deleteUser(button) {
        // Remove the row from the table
        const row = button.closest('tr');
        row.remove();
        
        // Perform additional delete operations (e.g., send a request to the server to delete the user)
    }

    // Add event listener to handle form submission
    document.getElementById('editForm').addEventListener('submit', function(event) {
        event.preventDefault();
        // Save changes (e.g., send a request to the server to update user permissions)
        // Close the modal
        var editModal = new bootstrap.Modal(document.getElementById('editModal'));
        editModal.hide();
    });

    // Add event listener to populate the modal with user data when the Edit button is clicked
    document.querySelectorAll('.btn-info').forEach(button => {
        button.addEventListener('click', function() {
            const row = button.closest('tr');
            const username = row.querySelector('td:first-child').textContent;
            const permissions = row.querySelector('td:nth-child(3)').textContent;

            document.getElementById('editUser').value = username;
            // Populate the permissions select box based on the user's current permissions
            // (additional logic needed to select the correct options)
        });
    });
</script>
{% endblock %}
