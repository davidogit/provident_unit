<!DOCTYPE html>
{% load static %}
{% load form_filters %}
<html lang="en">

<!-- Mirrored from themepixels.me/demo/dashbyte/pages/verify-account.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 12 Nov 2023 18:21:29 GMT -->

<head>

  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Meta -->
  <meta name="description" content="">
  <meta name="author" content="Themepixels">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.png' %}">

  <title>Forgot Password</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="{% static 'lib/remixicon/fonts/remixicon.css' %}">

  <!-- Template CSS -->
  <link rel="stylesheet" href="{% static 'assets/css/style.min.css' %}">
</head>

<body class="page-auth">

  <div class="header">
    <div class="container">
      <a href="#" class="header-logo"></a>
      <nav class="nav nav-icon">
        <a href="#" class="nav-link"><i class="ri-twitter-fill"></i></a>
        <a href="#" class="nav-link"><i class="ri-github-fill"></i></a>
        <a href="#" class="nav-link"><i class="ri-dribbble-line"></i></a>
      </nav>
    </div><!-- container -->
  </div><!-- header -->

  <div class="content">
    <div class="container">
      <div class="card card-auth">
        <div class="card-body text-center">
          <div class="mb-5">
            <object type="image/svg+xml" data="{% static 'assets/svg/forgot_password.svg' %}" class="w-50"></object>
          </div>
          <h3 class="card-title">Reset your password</h3>
          <p class="card-text mb-5">Enter your email address and we will send you a link to reset your password.</p>


          <form action="" method="POST">
            {% csrf_token %}
            <div class="row g-2">
              <div class="col-sm-8">
                {{ form.email|add_class:"form-control" }}
              </div>
              <div class="col-sm-4">
                <input type="submit" class="btn btn-primary btn-sign" value="Reset">
              </div>
            </div><!-- row -->
          </form>

        </div><!-- card-body -->
      </div><!-- card -->
    </div><!-- container -->
  </div><!-- content -->

  <script src="{% static 'lib/jquery/jquery.min.js' %}"></script>
  <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script>
    'use script'

    var skinMode = localStorage.getItem('skin-mode');
    if (skinMode) {
      $('html').attr('data-skin', 'dark');
    }
  </script>
</body>

<!-- Mirrored from themepixels.me/demo/dashbyte/pages/verify-account.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 12 Nov 2023 18:21:30 GMT -->

</html>
