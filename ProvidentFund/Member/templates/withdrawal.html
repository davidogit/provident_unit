{% extends "member_base.html" %}
{% block title %}Withdraw Funds{% endblock %}
{% block content %}
<div class="main main-app p-3 p-lg-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header text-center bg-primary text-white">
          <h4>Withdraw Funds</h4>
        </div>
        <div class="card-body">
          <form id="withdrawalForm">
            {% csrf_token %}
            <!-- Scheme Selection -->
            <div class="form-group mb-3">
              <label for="scheme-type" class="form-label">Select Scheme</label>
              <select name="scheme_id" id="scheme-type" class="form-control" required>
                <option value="" disabled selected>Choose scheme type</option>
                {% for scheme in schemes %}
                <option value="{{ scheme.id }}">{{ scheme.name }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Amount Input -->
            <div class="form-group mb-3">
              <label for="amount" class="form-label">Amount (GHS)</label>
              <input
                name="amount"
                type="number"
                id="amount"
                class="form-control"
                placeholder="Enter amount in GHS"
                min="1"
                step="0.01"
                required
              />
              <small class="form-text text-muted">
                Available balance: GHS<span id="availableBalance"> </span>
              </small>
            </div>

            <!-- Submit Button -->
            <div class="form-submit text-center">
              <button type="button" id="withdrawButton" class="btn btn-primary btn-block">
                <span id="buttonText">Request Withdrawal</span>
                <span id="loadingSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // Fetch and display available balance when scheme is selected
  $(document).ready(function(){
    $('#scheme-type').on('change', function(){
      var schemeId = $(this).val();
      var staff_id = "{{request.user.member.staff_id}}"
      console.log(staff_id)
      var tenant = "{{request.tenant.id}}"
      var url = `/${tenant}/members/get-balance/${schemeId}/${staff_id}/`
      console.log(url)
      $.ajax({
        type: 'GET',
        url: url,
        success: function(response) {
          console.log(response)
          if (response.status==="success"){
           
            $('#availableBalance').text(response.balance); 
          }else{
            $('#availableBalance').text("0.00"); 
          }
        },
        error: function(xhr, status, error) {
          console.log(xhr.response.message)
        }


      });
    });
  });
  
  // Handle withdrawal request submission
  document.getElementById("withdrawButton").addEventListener("click", function () {
    const schemeId = document.getElementById("scheme-type").value;
    const amount = document.getElementById("amount").value;

    if (!schemeId || !amount) {
      alert("Please fill in all fields.");
      return;
    }

    // Validate amount
    if (parseFloat(amount) < 1) {
      alert("Minimum withdrawal amount is GHS 1.00.");
      return;
    }

    // Disable button and show spinner
    const withdrawButton = document.getElementById("withdrawButton");
    const buttonText = document.getElementById("buttonText");
    const loadingSpinner = document.getElementById("loadingSpinner");

    withdrawButton.disabled = true;
    buttonText.textContent = "Processing...";
    loadingSpinner.classList.remove("d-none");

    fetch("", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": "{{ csrf_token }}",
      },
      body: JSON.stringify({
        scheme_id: schemeId,
        amount: amount,
      }),
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.status === "success") {
          alert(data.message);
          // Reset form on success
          document.getElementById("withdrawalForm").reset();
          document.getElementById("availableBalance").textContent = "GHS 0.00";
        } else {
          alert("Error: " + data.message);
        }
      })
      .catch((error) => {
        console.error("Error:", error);
        alert("An error occurred while processing the request.");
      })
      .finally(() => {
        // Re-enable button and hide spinner
        withdrawButton.disabled = false;
        buttonText.textContent = "Request Withdrawal";
        loadingSpinner.classList.add("d-none");
      });
  });
</script>
{% endblock %}
