<!DOCTYPE html>
{% load static %}
<html lang="en">

<!-- Mirrored from themepixels.me/demo/dashbyte/pages/verify-account.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 12 Nov 2023 18:21:29 GMT -->

<head>

  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Meta -->
  <meta name="description" content="">
  <meta name="author" content="Themepixels">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.png' %}">

  <title>DashByte - Premium Dashboard Template</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="{% static 'lib/remixicon/fonts/remixicon.css' %}">

  <!-- Template CSS -->
  <link rel="stylesheet" href="{% static 'assets/css/style.min.css' %}">
</head>

<body class="page-sign">

  <div class="card card-sign">
    <div class="card-header">
      <!-- <a href="../index.html" class="header-logo mb-4">dashbyte</a> -->
      <h3 class="card-title">Verify Identity</h3>
      <p class="card-text">Please enter one-time-pin to continue.</p>
    </div><!-- card-header -->

    <form action="" method="POST" id="otpForm">
      {% csrf_token %}
      <div class="card-body">
        <div class="d-flex mb-4">
            <!-- <label for="otp" class="form-label">OTP:</label> -->
            <input class="form-control otp-input me-1 text-center" type="text" id="otp-1" name="otp-1" required maxlength="1">
            <input class="form-control otp-input me-1 text-center" type="text" id="otp-2" name="otp-2" required maxlength="1">
            <input class="form-control otp-input me-1 text-center" type="text" id="otp-3" name="otp-3" required maxlength="1">
            <input class="form-control otp-input text-center" type="text" id="otp-4" name="otp-4" required maxlength="1">
        </div>

        <input type="submit" class="btn btn-primary btn-sign" value="Verify">
      </div><!-- card-body -->
  </div><!-- card -->
  </form>



  <script src="{% static 'lib/jquery/jquery.min.js' %}"></script>
  <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script>
    'use script'

    var skinMode = localStorage.getItem('skin-mode');
    if (skinMode) {
      $('html').attr('data-skin', 'dark');
    }

    $(document).ready(function() {
      $('.otp-input').on('keyup', function(e) {
        if (e.key >= '0' && e.key <= '9') {
          $(this).next('.otp-input').focus();
        } else if (e.key === 'Backspace') {
          $(this).prev('.otp-input').focus();
        }
      });
    });

  </script>
</body>
</html>
