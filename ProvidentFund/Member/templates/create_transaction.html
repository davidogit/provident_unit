{% extends "member_base.html" %} {% block title %}Make a Payment{% endblock %}
{% block extra_head %}
<meta name="csrf_token" content="{{ csrf_token }}" />
{% endblock %} {% block content %}
<div class="main main-app p-3 p-lg-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-header text-center bg-primary text-white">
          <h4>Make a Payment</h4>
        </div>
        <div class="card-body">
          <form method="POST" id="paymentForm">
            {% csrf_token %}
            <div class="form-group mb-3">
              <label for="scheme-type" class="form-label">Select Scheme</label>
              <select
                name="scheme_id"
                id="scheme-type"
                class="form-control"
                required
                aria-label="Select Scheme"
              >
                <option value="" disabled selected>Choose scheme type</option>
                {% for scheme in schemes %}
                <option value="{{ scheme.id }}">{{ scheme.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group mb-3">
              <label for="email-address" class="form-label"
                >Email Address</label
              >
              <input
                name="email"
                type="email"
                id="email-address"
                class="form-control"
                required
                aria-label="Email Address"
              />
            </div>
            <div class="form-group mb-3">
              <label for="amount" class="form-label">Amount</label>
              <input
                name="amount"
                type="number"
                id="amount"
                class="form-control"
                placeholder="Enter amount in GHS"
                required
                aria-label="Amount in GHS"
              />
            </div>
            <input
              type="hidden"
              id="reference"
              name="reference"
              value="{{ reference }}"
            />
            <div class="form-submit text-center">
              <button
                type="button"
                onclick="payWithPaystack()"
                class="btn btn-primary btn-block"
              >
                Pay
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://js.paystack.co/v2/inline.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const paymentForm = document.getElementById("paymentForm");
    const paystackPublicKey = "{{ PAYSTACK_PUBLIC_KEY }}";
    const reference = "{{ reference }}";

    paymentForm.addEventListener("submit", function (e) {
      e.preventDefault();
    });

    window.payWithPaystack = function () {
      console.log("Pay with Paystack called");
      const schemeId = document.getElementById("scheme-type").value;
      const email = document.getElementById("email-address").value;
      const amount = document.getElementById("amount").value;

      if (!schemeId || !email || !amount) {
        alert("Please fill in all fields");
        return;
      }

      console.log("Fields are filled, proceeding to payment");

      let handler = new PaystackPop();
      handler.newTransaction({
        key: paystackPublicKey,
        email: email,
        amount: Math.round(parseFloat(amount) * 100), // Ensure amount is an integer
        currency: "GHS",
        ref: reference,
        onClose: function () {
          console.log("Payment window closed");
          alert("Transaction was not completed, window closed.");
        },
        callback: function (response) {
          console.log("Payment response:", response);
          recordTransaction(response, schemeId, email, amount);
        },
      });
    };

    function recordTransaction(response, schemeId, email, amount) {
      console.log("Recording transaction with data:", {
        response,
        schemeId,
        email,
        amount,
      });
      fetch("", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({
          scheme_id: schemeId,
          email: email,
          amount: amount,
          reference: response.reference,
        }),
      })
        .then((response) => {
          console.log("Server response status:", response.status);
          if (!response.ok) {
            throw new Error("Network response was not ok: " + response.status);
          }
          return response.json();
        })
        .then((data) => {
          console.log("Server response data:", data);
          if (data.status === "success") {
            alert("Payment successful!");
            if (data.redirect_url){
              window.location.href = data.redirect_url;
            }
            else{
              console.error("Redirect URL not provided")
            }
          } else {
            alert("Payment recording failed: " + data.message);
          }
        })
        .catch((error) => {
          console.error("Error details:", error);
          alert(
            "An error occurred while recording the transaction. Please check the console for more details."
          );
        });
    }
  });
</script>
{% endblock %}
