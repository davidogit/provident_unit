<!DOCTYPE html>
{% load static %}
<html lang="en">

<!-- Mirrored from themepixels.me/demo/dashbyte/pages/verify-account.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 12 Nov 2023 18:21:29 GMT -->

<head>

  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Meta -->
  <meta name="description" content="">
  <meta name="author" content="Themepixels">

  <meta name="csrf-token" content="{{ csrf_token }}">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.png' %}">

  <title>Provident Fund - Login</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="{% static 'lib/remixicon/fonts/remixicon.css' %}">

  <!-- Template CSS -->
  <link rel="stylesheet" href="{% static 'assets/css/style.min.css' %}">
</head>

<body class="page-sign">

  <div class="card card-sign">
    <div class="card-header">
      <!-- <a href="../index.html" class="header-logo mb-4">dashbyte</a> -->
      <h3 class="card-title text-center">Log In</h3>
      <p class="card-text text-center">Welcome back! Please login to continue.</p>
      <p class="message-info text-danger text-center"></p>
    </div><!-- card-header -->

    <form class="login-form" action="" method="POST">
      {% csrf_token %}
      <div class="card-body">
        <div class="mb-4">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" placeholder="Enter your username" name="username">
        </div>

        <div class="mb-4">
          <label class="form-label d-flex justify-content-between">Password <a href="{% url 'password_reset' %}">Forgot password?</a></label>
          <input type="password" class="form-control" placeholder="Enter your password" name="password">
        </div>
        <!-- <button>OTP</button> -->
        <input id="submit" type="submit" class="btn btn-primary btn-sign" value="Login">

        <div class="divider">Dont have an account?</div>

        <div class="row gx-2">
          <!-- <div class="col"><button class="btn btn-facebook"><i class="ri-facebook-fill"></i> Facebook</button></div> -->
          <div class="col text-center"><span><a href="{% url 'register' tenant_id=request.tenant.id %}">Sign up here</a></span></div>
          <!-- <div class="col text-center"><span><a href="{% url 'password_reset' %}">Forgot password? click here to reset password</a></span></div> -->
          
          <!-- <div class="col"><button class="btn btn-google"><i class="ri-google-fill"></i> Google</button></div> -->
        </div><!- row
      </div><!-- card-body -->
      <!-- <div class="card-footer">
      </div>
      card-footer -->
    </form>
  </div><!-- card -->
  

  <script src="{% static 'lib/jquery/jquery.min.js' %}"></script>
  <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script>
    'use script'

    var skinMode = localStorage.getItem('skin-mode');
    if (skinMode) {
      $('html').attr('data-skin', 'dark');
    };

    $(document).ready(function(){
      // Get CSRF token from the meta tag
      var csrfToken = $('meta[name="csrf-token"]').attr('content');

      $('.login-form').on('submit', function(event){
        event.preventDefault();
        var form = $(this);

        // Serialize the form data, including the CSRF token
        var formData = form.serialize();
        
        // Add CSRF token manually to the form data
        formData += '&csrfmiddlewaretoken=' + encodeURIComponent(csrfToken);

        $.ajax({
          type: 'POST',
          url: form.attr('action'),
          data: formData,  // Send the serialized form data along with CSRF token
          success: function(response){
            if (response.status === 'error'){
              $('.message-info').text(response.message); // Display error message
            } else {
              window.location.href = response.redirect_url; // Redirect to the dashboard
            }
          },
          error: function(xhr, status, error){
            // Handle AJAX error
            $('.message-info').text('An error occurred. Please try again.');
          }
        });
      });
    });




  </script>
</body>
</html>
