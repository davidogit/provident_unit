<!-- register.html -->

<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Meta -->
    <meta name="description" content="">
    <meta name="author" content="Themepixels">

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.png' %}">

    <title>Register</title>

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="{% static 'lib/remixicon/fonts/remixicon.css' %}">

    <!-- Template CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/style.min.css' %}">
</head>

<body class="page-sign">

<div class="card card-sign">
    <div class="card-header">
        <h3 class="card-title text-center">Register</h3>
        <p class="card-text text-center">Please fill in your details to register.</p>
    </div><!-- card-header -->

    <form action="{% url 'register' tenant_id=request.tenant.id %}" method="POST">
        {% csrf_token %}
        <div class="card-body">
            <div class="mb-4">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" placeholder="Enter your username" name="username" required>
            </div>
            <div class="mb-4">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" placeholder="Enter your first name" name="first_name" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" placeholder="Enter your last name" name="last_name" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Staff ID</label>
                <input type="number" class="form-control" placeholder="Enter your staff ID" name="staff_id" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email address" name="email" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Tel Number</label>
                <input type="tel" class="form-control" placeholder="Enter your phone number" name="tel_number" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password" name="password" required>
            </div>
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="termsCheckbox" name="termsCheckbox" required>
                <label class="form-check-label" for="termsCheckbox"></label>
                I agree to the <a href="{% url 'terms_and_conditions' tenant_id=request.tenant.id %}" target="_blank">terms and conditions</a>
            </div>
            <input type="submit" class="btn btn-primary btn-sign" value="Register">

            <!-- <div class="divider"><span>or register with</span></div> -->

            <!-- Uncomment the following section if you want to enable registration with Facebook and Google
            <div class="row gx-2">
                <div class="col"><button class="btn btn-facebook"><i class="ri-facebook-fill"></i> Facebook</button></div>
                <div class="col"><button class="btn btn-google"><i class="ri-google-fill"></i> Google</button></div>
            </div> row -->
        </div><!-- card-body -->
    </form>

    <div class="card-footer">
        Already have an account? <a href="{% url 'login' tenant_id=request.tenant.id %}">Sign In</a>
    </div><!-- card-footer -->

    <script src="{% static 'lib/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script>
        'use script'

        var skinMode = localStorage.getItem('skin-mode');
        if (skinMode) {
            $('html').attr('data-skin', 'dark');
        }
    </script>
</body>

</html>
