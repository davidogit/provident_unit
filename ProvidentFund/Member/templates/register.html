<!DOCTYPE html>
{% load static %}
<html lang="en">
  
<!-- Mirrored from themepixels.me/demo/dashbyte/pages/sign-in.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 12 Nov 2023 18:21:22 GMT -->
<head>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Meta -->
    <meta name="description" content="">
    <meta name="author" content="Themepixels">

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.png' %}">

    <title>Provident Fund</title>

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="{% static 'lib/remixicon/fonts/remixicon.css' %}">

    <!-- Template CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/style.min.css' %}">
  </head>
  <body class="register">

    <div class="card card-sign">
      <div class="card-header">
        <a href="../index.html" class="header-logo mb-4">dashbyte</a>
        <h3 class="card-title">Register</h3>
        <p class="card-text">Create your account. It's free and only takes a minute.</p>
      </div><!-- card-header -->

      <form action="">
        <div class="card-body">
          <div class="mb-4">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" placeholder="Enter your username" name="username">
          </div>
          <div class="mb-4">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" placeholder="Enter your first name" name="first_name">
          </div>
          <div class="mb-4">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" placeholder="Enter your last name" name="last_name">
          </div>
          <div class="mb-4">
            <label class="form-label">staff Id</label>
            <input type="email" class="form-control" placeholder="Enter your email address" name="email">
          </div>
          <div class="mb-4">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" placeholder="Enter your email address" name="email">
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Enter your password" name="password">
          </div>
          <button class="btn btn-primary btn-sign">Register</button>
  
          <div class="divider"><span>or register with</span></div>
  
          <!-- Uncomment the following section if you want to enable registration with Facebook and Google
          <div class="row gx-2">
            <div class="col"><button class="btn btn-facebook"><i class="ri-facebook-fill"></i> Facebook</button></div>
            <div class="col"><button class="btn btn-google"><i class="ri-google-fill"></i> Google</button></div>
          </div><!- row -->
        </div><!-- card-body -->
      </form>
 
      <div class="card-footer">
        Already have an account? <a href="sign-in.html">Sign In</a>
      </div><!-- card-footer -->
    </div><!-- card -->
    <script src="{% static 'lib/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'lib/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script>
      'use script'

      var skinMode = localStorage.getItem('skin-mode');
      if(skinMode) {
        $('html').attr('data-skin', 'dark');
      }
    </script>
  </body>

</html>
